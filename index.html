<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <!-- 1. coi-serviceworker: MUST be the first script in <head> -->
  <!-- Injects COOP/COEP headers to enable SharedArrayBuffer & Multi-Threading on GitHub Pages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/coi-serviceworker/0.1.7/coi-serviceworker.min.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidConvert - Multi-Threaded Universal Video Converter</title>
  
  <!-- CDNJS Libraries -->
  <!-- FFmpeg v0.11.6 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.11.6/ffmpeg.min.js"></script>
  <!-- FileSaver.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    /* Default: Dark Theme */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-item-bg: #0f172a;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --status-bg: #0f172a;
      --status-text: #38bdf8;
      --badge-bg: #312e81;
      --badge-text: #c7d2fe;
      --accent-badge-bg: #065f46;
      --accent-badge-text: #34d399;
    }

    /* Light Theme Override */
    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-item-bg: #f9fafb;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --text: #111827;
      --subtext: #6b7280;
      --border: #d1d5db;
      --input-bg: #f9fafb;
      --status-bg: #1e293b;
      --status-text: #38bdf8;
      --badge-bg: #e0e7ff;
      --badge-text: #3730a3;
      --accent-badge-bg: #d1fae5;
      --accent-badge-text: #065f46;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);

    .container {
      background: var(--card-bg);
      border-radius: 12px;

      width: 100%;
      max-width: 560px;
      padding: 30px;
      box-sizing: border-box;
      position: relative;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      border: 1px solid var(--border);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      width: auto;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background-color: var(--border);
    }

    .subtitle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 8px;
    }

    p.subtitle {
      color: var(--subtext);
      font-size: 0.88rem;
      margin: 0;
    }

    .thread-badge {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--accent-badge-bg);
      color: var(--accent-badge-text);
      padding: 4px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 8px;

    input[type="file"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
      background-color: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s ease, background-color 0.3s ease;
    }

    option, optgroup {
      background-color: var(--card-bg);
      color: var(--text);
    }

    button.btn-primary {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button.btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button.btn-primary:disabled {
      background-color: #818cf8;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: var(--status-bg);
      color: var(--status-text);
      font-family: monospace;
      font-size: 0.8rem;
      display: none;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    /* Downloads & History Section */
    .history-section {
      margin-top: 30px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .history-header h2 {
      font-size: 1.1rem;
      margin: 0;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .btn-clear:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      background-color: var(--card-item-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .file-name {
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-all;
    }

    .file-meta {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-top: 2px;
    }

    .format-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .media-preview {
      width: 100%;
      max-height: 200px;
      border-radius: 6px;
      background: #000;
      margin-top: 4px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-action {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }

    .btn-download {
      background-color: var(--primary);
      color: white;
    }

    .btn-download:hover {
      background-color: var(--primary-hover);
    }

    .btn-delete {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      flex: 0 0 auto;
    }

    .btn-delete:hover {
      color: var(--danger);
      border-color: var(--danger);
      background-color: rgba(239, 68, 68, 0.05);
    }

    .empty-state {
      text-align: center;
      color: var(--subtext);
      font-size: 0.85rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>VidConvert</h1>
      <!-- Theme Toggle Button -->
      <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle theme">
        <span id="themeIcon">☀️</span> <span id="themeText">Light</span>
      </button>
    </div>
    
    <div class="subtitle-container">
      <p class="subtitle">Convert almost any video or audio format directly in your browser.</p>
      <!-- Mode Badge (Multi-Threaded / Single-Threaded indicator) -->
      <span id="modeBadge" class="thread-badge">Checking CPU mode...</span>
    </div>

    <!-- File Input -->
    <div class="form-group">
      <label for="videoFile">Select Any Input File (.dat, .avi, .mkv, .mov, etc.)</label>
      <input type="file" id="videoFile" accept="*/*" />
    </div>

    <!-- Output Format Selector -->
    <div class="form-group">
      <label for="targetFormat">Convert To Output Format</label>
      <select id="targetFormat">
        <optgroup label="Popular Video Formats">
          <option value="mp4">MP4 (.mp4)</option>
          <option value="webm">WebM (.webm)</option>
          <option value="mkv">MKV / Matroska (.mkv)</option>
          <option value="avi">AVI (.avi)</option>
          <option value="mov">QuickTime MOV (.mov)</option>
          <option value="wmv">Windows Media Video (.wmv)</option>
          <option value="flv">Flash Video (.flv)</option>
          <option value="3gp">3GP Mobile (.3gp)</option>
          <option value="ogv">Ogg Video (.ogv)</option>
          <option value="mpg">MPEG-1 / MPEG-2 (.mpg)</option>
          <option value="ts">MPEG-TS Transport Stream (.ts)</option>
          <option value="vob">DVD VOB (.vob)</option>
          <option value="m4v">iTunes M4V (.m4v)</option>
        </optgroup>

        <optgroup label="Animated Formats">
          <option value="gif">Animated GIF (.gif)</option>
          <option value="webp">Animated WebP (.webp)</option>
        </optgroup>

        <optgroup label="Audio Extraction (Convert Video to Audio)">
          <option value="mp3">MP3 Audio (.mp3)</option>
          <option value="wav">WAV Uncompressed (.wav)</option>
          <option value="aac">AAC Audio (.aac)</option>
          <option value="m4a">M4A Audio (.m4a)</option>
          <option value="ogg">Ogg Vorbis Audio (.ogg)</option>
          <option value="flac">FLAC Lossless Audio (.flac)</option>
          <option value="opus">Opus Audio (.opus)</option>
          <option value="wma">Windows Media Audio (.wma)</option>
          <option value="aiff">AIFF Audio (.aiff)</option>
        </optgroup>
      </select>
    </div>

    <button id="convertBtn" class="btn-primary">Convert File</button>

    <div id="statusBox" class="status-box"></div>

    <!-- Interactive Converted Files & Cache History -->
    <div class="history-section">
      <div class="history-header">
        <h2>Converted Files (<span id="historyCount">0</span>)</h2>
        <button id="clearAllBtn" class="btn-clear" style="display: none;">Clear Cache</button>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">No converted files cached yet.</div>
      </div>
    </div>

  </div>

  <script>
    // -------------------------------------------------------------
    // 1. Check Multi-Threading Capability (window.crossOriginIsolated)
    // -------------------------------------------------------------
    const modeBadge = document.getElementById('modeBadge');
    const isMultiThreaded = window.crossOriginIsolated;

    if (isMultiThreaded) {
      modeBadge.innerText = '🚀 Multi-Threaded Core Active';
    } else {
      modeBadge.innerText = '⚡ Single-Threaded Mode';
      modeBadge.style.background = '#854d0e';
      modeBadge.style.color = '#fef08a';
    }

    // -------------------------------------------------------------
    // 2. IndexedDB Persistent Storage (Browser Cache)
    // -------------------------------------------------------------
    const DB_NAME = 'VidConvertCacheDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'converted_files';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveToCache(item) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function getAllCachedFiles() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function deleteFromCache(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function clearAllCache() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.clear();
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    function formatBytes(bytes, decimals = 1) {
      if (!bytes || bytes === 0) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    // -------------------------------------------------------------
    // 3. Interactive Downloads UI Manager
    // -------------------------------------------------------------
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    const clearAllBtn = document.getElementById('clearAllBtn');

    async function renderHistory() {
      const cachedItems = await getAllCachedFiles();
      historyList.innerHTML = '';
      historyCount.innerText = cachedItems.length;

      if (cachedItems.length === 0) {
        historyList.innerHTML = '<div class="empty-state">No converted files cached yet.</div>';
        clearAllBtn.style.display = 'none';
        return;
      }

      clearAllBtn.style.display = 'inline-block';

      cachedItems.sort((a, b) => b.timestamp - a.timestamp);

      cachedItems.forEach(item => {
        const blobUrl = URL.createObjectURL(item.blob);

        const card = document.createElement('div');
        card.className = 'history-item';

        let previewHTML = '';
        if (item.mimeType.startsWith('video/')) {
          previewHTML = `<video class="media-preview" controls src="${blobUrl}"></video>`;
        } else if (item.mimeType.startsWith('audio/')) {
          previewHTML = `<audio class="media-preview" controls src="${blobUrl}"></audio>`;
        } else if (item.mimeType.startsWith('image/')) {
          previewHTML = `<img class="media-preview" src="${blobUrl}" style="object-fit: contain; max-height: 180px;" />`;
        }

        card.innerHTML = `
          <div class="history-item-info">
            <div>
              <div class="file-name">${item.fileName}</div>
              <div class="file-meta">${formatBytes(item.size)} • ${new Date(item.timestamp).toLocaleTimeString()}</div>
            </div>
            <span class="format-badge">${item.ext}</span>
          </div>
          ${previewHTML}
          <div class="item-actions">
            <button class="btn-action btn-download" data-id="${item.id}">
              ⬇️ Download File
            </button>
            <button class="btn-action btn-delete" data-id="${item.id}" title="Remove from Cache">
              🗑️
            </button>
          </div>
        `;

        card.querySelector('.btn-download').addEventListener('click', () => {
          saveAs(item.blob, item.fileName);
        });

        card.querySelector('.btn-delete').addEventListener('click', async () => {
          await deleteFromCache(item.id);
          URL.revokeObjectURL(blobUrl);
          renderHistory();
        });

        historyList.appendChild(card);
      });
    }

    clearAllBtn.addEventListener('click', async () => {
      if (confirm('Are you sure you want to clear all cached conversions from browser storage?')) {
        await clearAllCache();
        renderHistory();
      }
    });

    // -------------------------------------------------------------
    // 4. Theme Toggle Management
    // -------------------------------------------------------------
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('vidconvert_theme', theme);
      if (theme === 'dark') {
        themeIcon.innerText = '☀️';
        themeText.innerText = 'Light';
      } else {
        themeIcon.innerText = '🌙';
        themeText.innerText = 'Dark';
      }
    }

    const savedTheme = localStorage.getItem('vidconvert_theme') || 'dark';
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // -------------------------------------------------------------
    // 5. FFmpeg Engine Setup (Multi-Threaded / Single-Threaded Adaptive)
    // -------------------------------------------------------------
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;

    const fileInput = document.getElementById('videoFile');
    const formatSelect = document.getElementById('targetFormat');
    const convertBtn = document.getElementById('convertBtn');
    const statusBox = document.getElementById('statusBox');

    function updateStatus(message) {
      statusBox.style.display = 'block';
      statusBox.innerText = message;
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    function getBaseFileName(fileName) {
      const lastDotIndex = fileName.lastIndexOf('.');
      if (lastDotIndex === -1) return fileName;
      return fileName.substring(0, lastDotIndex);
    }

    function getMimeType(ext) {
      const mimes = {
        mp4: 'video/mp4', webm: 'video/webm', mkv: 'video/x-matroska',
        avi: 'video/x-msvideo', mov: 'video/quicktime', wmv: 'video/x-ms-wmv',
        flv: 'video/x-flv', '3gp': 'video/3gpp', ogv: 'video/ogg',
        mpg: 'video/mpeg', ts: 'video/mp2t', vob: 'video/dvd', m4v: 'video/x-m4v',
        gif: 'image/gif', webp: 'image/webp',
        mp3: 'audio/mpeg', wav: 'audio/wav', aac: 'audio/aac', m4a: 'audio/mp4',
        ogg: 'audio/ogg', flac: 'audio/flac', opus: 'audio/opus',
        wma: 'audio/x-ms-wma', aiff: 'audio/aiff'
      };
      return mimes[ext] || 'application/octet-stream';
    }

    convertBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a video or audio file to convert!');
        return;
      }

      const originalName = file.name;
      const baseName = getBaseFile
